name: AWS DEPLOY TO STAGING

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - dev

jobs:
  aws-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual dispatch deploys the ref you dispatched, so a feature
          # branch can be tested on staging without merging first. The
          # PR-close trigger always deploys dev, the integration branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'dev' }}

      # The source tree is shipped, not dist/: httpd.conf has to reach the box
      # for the /sprintboardapi ProxyPass to exist at all. The multi-stage
      # dockerfile runs the Vue build on the server.
      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@v2.1.1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rltgoDzvO --delete --exclude=node_modules --exclude=.git --exclude=dist"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ubuntu
          TARGET: "nodeapps/sprintboard-system-frontend"

      - name: Bring up the stack
        uses: JimCronqvist/action-ssh@master
        with:
          hosts: "ubuntu@${{ secrets.REMOTE_HOST }}"
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          debug: false
          command: |
            set -e
            cd nodeapps/sprintboard-system-frontend

            # get.docker.com may not publish a repo for Ubuntu 26.04's codename
            # yet, so prefer distro packages. Normally the backend deploy has
            # already installed Docker; this is the standalone path.
            if ! (command -v docker >/dev/null && docker compose version >/dev/null 2>&1); then
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-v2 \
                || curl -fsSL https://get.docker.com | sudo sh
              sudo systemctl enable --now docker
            fi
            docker --version

            # Declared external in docker-compose.yaml and normally created by
            # the backend stack. Created here too so frontend-first deploys do
            # not fail — there is no SSH access to fix that by hand.
            sudo docker network create jira_backend_network || true

            COMPOSE="docker compose -f docker-compose.yaml -f docker-compose.prod.yaml"
            sudo $COMPOSE up -d --build

      # With no SSH access, the Actions log is the only console onto the box.
      - name: Diagnostics
        if: always()
        uses: JimCronqvist/action-ssh@master
        with:
          hosts: "ubuntu@${{ secrets.REMOTE_HOST }}"
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          debug: false
          command: |
            cd nodeapps/sprintboard-system-frontend
            COMPOSE="docker compose -f docker-compose.yaml -f docker-compose.prod.yaml"
            sudo $COMPOSE ps
            echo "----- frontend logs -----"
            sudo $COMPOSE logs --tail=50
