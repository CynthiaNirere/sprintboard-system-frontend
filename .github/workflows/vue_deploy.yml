name: AWS DEPLOY TO STAGING

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - dev

jobs:
  aws-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual dispatch deploys the ref you dispatched, so a feature
          # branch can be tested on staging without merging first. The
          # PR-close trigger always deploys dev, the integration branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'dev' }}

      # The source tree is shipped, not dist/: httpd.conf has to reach the box
      # for the /sprintboardapi ProxyPass to exist at all. The multi-stage
      # dockerfile runs the Vue build on the server.
      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@v2.1.1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rltgoDzvO --delete --exclude=node_modules --exclude=.git --exclude=dist"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ubuntu
          TARGET: "nodeapps/sprintboard-system-frontend"

      # This host also runs the backend stack, which hit this same disk at
      # 95% full — see sprintboard-system-backend's node-deploy.yml for the
      # full writeup. Same shared 6.6GB volume, so the same preflight applies
      # here rather than relying on the backend deploy having run first.
      - name: Preflight — disk space and apt health
        uses: JimCronqvist/action-ssh@master
        with:
          hosts: "ubuntu@${{ secrets.REMOTE_HOST }}"
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          debug: false
          command: |
            echo "===== disk before ====="
            df -h /
            echo "===== biggest consumers ====="
            sudo du -xh --max-depth=2 /var /home /usr 2>/dev/null | sort -rh | head -25

            echo "===== repairing apt ====="
            sudo dpkg --configure -a || true
            sudo apt-get --fix-broken install -y || true

            echo "===== reclaiming space ====="
            sudo apt-get clean
            sudo journalctl --vacuum-size=50M || true
            sudo apt-get autoremove --purge -y || true

            # Superseded snap revisions are a routine multi-hundred-MB hog on
            # Ubuntu and survive apt cleanup entirely.
            sudo snap set system refresh.retain=2 2>/dev/null || true
            sudo snap list --all 2>/dev/null | awk '/disabled/{print $1, $3}' \
              | while read -r name rev; do sudo snap remove "$name" --revision="$rev" || true; done

            # Package index caches; regenerated by the next apt-get update.
            sudo rm -rf /var/lib/apt/lists/* || true

            # Leftover dependency trees from any app deployed here — this
            # frontend's own rsync excludes node_modules, but other apps on
            # this box may not.
            find ~/nodeapps -maxdepth 3 -name node_modules -type d -prune -exec rm -rf {} + 2>/dev/null || true

            # Rotated/compressed logs that journald's vacuum does not touch.
            sudo find /var/log -type f \( -name '*.gz' -o -name '*.1' -o -name '*.old' \) -delete 2>/dev/null || true
            sudo rm -rf /var/cache/snapd/* /var/tmp/* || true

            # Old kernels left behind in /boot when autoremove misses them.
            sudo apt-get purge -y $(dpkg -l 'linux-image-*' 2>/dev/null \
              | awk '/^ii/{print $2}' | grep -v "$(uname -r)" | head -5) 2>/dev/null || true

            echo "===== disk after ====="
            df -h /

      - name: Bring up the stack
        uses: JimCronqvist/action-ssh@master
        with:
          hosts: "ubuntu@${{ secrets.REMOTE_HOST }}"
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          debug: false
          command: |
            set -e
            cd nodeapps/sprintboard-system-frontend

            # get.docker.com may not publish a repo for Ubuntu 26.04's codename
            # yet, so prefer distro packages. Normally the backend deploy has
            # already installed Docker; this is the standalone path.
            if ! (command -v docker >/dev/null && docker compose version >/dev/null 2>&1); then
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-v2 docker-buildx-plugin \
                || curl -fsSL https://get.docker.com | sudo sh
              sudo systemctl enable --now docker
            fi
            docker --version

            # Compose warned "configured to build using Bake, but buildx isn't
            # installed" and fell back to the legacy builder, which is less
            # disk-efficient. Make sure buildx is there even on a host where
            # Docker itself was already installed by an earlier deploy.
            sudo apt-get install -y docker-buildx-plugin || true

            # Declared external in docker-compose.yaml and normally created by
            # the backend stack. Created here too so frontend-first deploys do
            # not fail — there is no SSH access to fix that by hand.
            sudo docker network create jira_backend_network || true

            COMPOSE="docker compose -f docker-compose.yaml -f docker-compose.prod.yaml"

            # This image is built via a multi-stage dockerfile: the node:20-alpine
            # build stage pulls node_modules and runs vite, and that whole stage
            # is left dangling after every single run. Prune both sides of the
            # build or the box accumulates a full build stage per deploy.
            echo "----- docker usage before -----"
            sudo docker system df
            sudo docker builder prune -af || true
            sudo docker image prune -af || true
            sudo docker container prune -f || true
            df -h /

            # Fail fast with a clear, actionable error instead of letting
            # `npm run build` inside the image die ~30s in with a cryptic
            # "ENOENT: mkdir dist/assets" once the disk actually fills —
            # that error is Rollup trying to write output on a full disk;
            # overlay2 surfaces it as ENOENT instead of ENOSPC. 1800MB
            # matches the backend deploy's measured threshold for this same
            # box (peak ~1.75GB for that stack); raise it if this still
            # trips close to empty.
            AVAIL_MB=$(df -Pm / | awk 'NR==2 {print $4}')
            MIN_MB=1800
            if [ "$AVAIL_MB" -lt "$MIN_MB" ]; then
              echo "::error::Only ${AVAIL_MB}MB free on / after cleanup (need ${MIN_MB}MB+ for npm install + vite build). Pruning is not enough anymore — expand the EBS root volume on this host."
              exit 1
            fi

            # If this shows a host apache2/nginx, the container cannot bind :80.
            # Re-dispatch with replace_host_webserver=true.
            echo "----- listening on :80 -----"
            sudo ss -tlnp 'sport = :80' || true

            sudo $COMPOSE up -d --build

            # NEVER add --volumes here: the backend stack's database volume
            # lives on this same daemon.
            sudo docker builder prune -af
            sudo docker image prune -af
            sudo docker container prune -f
            echo "----- docker usage after -----"
            sudo docker system df
            df -h /

